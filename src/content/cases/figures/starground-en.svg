<svg viewBox="0 0 880 362" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="inherit" role="img" aria-label="Settlement has three outcomes: right pays double, wrong pays nothing, no correct answer is refunded. An answer without a stake still counts as a round, and attendance and ranking run on rounds answered">
<style>
.fx-t1{fill:var(--text-default,#191a1b)}
.fx-t2{fill:var(--text-muted,#3a3d44)}
.fx-t3{fill:var(--text-subtle,#62666d)}
.fx-card{fill:var(--surface-sunken,#f2f3f5);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-inset{fill:var(--surface-raised,#fff);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-ghost{fill:none;stroke:var(--line-default,#ccd3dd);stroke-width:1.25;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.fx-key{fill:var(--accent-default,#08090a)}
.fx-on{fill:var(--accent-on,#fff)}
.fx-sk{fill:var(--text-subtle,#62666d);opacity:.2}
.fx-sk-on{fill:var(--accent-on,#fff);opacity:.2}
.fx-ln{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-ln-on{fill:none;stroke:var(--accent-on,#fff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-dot{stroke-dasharray:.5 5}
.fx-rule{fill:none;stroke:var(--line-strong,#dfe1e5);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-rule-on{fill:none;stroke:var(--accent-on,#fff);stroke-opacity:.16;stroke-width:1;vector-effect:non-scaling-stroke}
.fx-mk{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.25}
</style>
<circle cx="8" cy="9.3" r="8" class="fx-key"/>
<path d="M4.6 9.5 L7.2 12 L11.5 6.9" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="24" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">Three outcomes</text>
<rect x="0" y="34" width="264" height="290" rx="16" class="fx-card"/>
<rect x="12" y="50" width="240" height="78" rx="8" class="fx-inset"/>
<text x="28" y="95" font-size="15" font-weight="600" class="fx-t1">Right</text>
<text x="236" y="96" font-size="18" font-weight="700" text-anchor="end" class="fx-t1">× 2</text>
<rect x="12" y="140" width="240" height="78" rx="8" class="fx-inset"/>
<text x="28" y="185" font-size="15" font-weight="600" class="fx-t1">Wrong</text>
<text x="236" y="186" font-size="18" font-weight="700" text-anchor="end" class="fx-t1">0</text>
<rect x="12" y="230" width="240" height="78" rx="8" class="fx-inset"/>
<text x="28" y="275" font-size="15" font-weight="600" class="fx-t1">No answer</text>
<text x="236" y="276" font-size="18" font-weight="700" text-anchor="end" class="fx-t1">Refund</text>
<text x="0" y="354" font-size="13.5" font-weight="500" class="fx-t3">All fits in one box on the result</text>
<path d="M296 34 V324" class="fx-rule"/>
<circle cx="336" cy="9.3" r="8" class="fx-key"/>
<path d="M332.6 9.5 L335.2 12 L339.5 6.9" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="352" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">Staking optional</text>
<rect x="328" y="50" width="264" height="70" rx="10" class="fx-inset"/>
<text x="460.0" y="90" font-size="15" font-weight="600" text-anchor="middle" class="fx-t1">Stake 100P, answer</text>
<rect x="328" y="136" width="264" height="70" rx="10" class="fx-ghost"/>
<text x="460.0" y="176" font-size="15" font-weight="600" text-anchor="middle" class="fx-t2">Answer with 0P</text>
<path d="M460.0 212 V244 M454.0 238 L460.0 244 L466.0 238" class="fx-ln"/>
<rect x="328" y="254" width="264" height="70" rx="10" class="fx-key"/>
<text x="460.0" y="294" font-size="16" font-weight="700" text-anchor="middle" class="fx-on">One round answered</text>
<text x="328" y="354" font-size="13.5" font-weight="500" class="fx-t2">Out of points, still in the five</text>
<path d="M624 34 V324" class="fx-rule"/>
<circle cx="664" cy="9.3" r="8" class="fx-mk"/>
<text x="680" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">Counted in rounds</text>
<path d="M656 50 H880" class="fx-rule"/>
<text x="656" y="80" font-size="13" font-weight="500" class="fx-t3">Attendance</text>
<text x="656" y="106" font-size="14.5" font-weight="600" class="fx-t1">Three rounds answered a day</text>
<path d="M656 142 H880" class="fx-rule"/>
<text x="656" y="172" font-size="13" font-weight="500" class="fx-t3">Ties</text>
<text x="656" y="198" font-size="14.5" font-weight="600" class="fx-t1">Correct answers, then join order</text>
<path d="M656 234 H880" class="fx-rule"/>
<text x="656" y="264" font-size="13" font-weight="500" class="fx-t3">Ranking</text>
<text x="656" y="290" font-size="14.5" font-weight="600" class="fx-t1">Guests are ranked too</text>
<path d="M656 326 H880" class="fx-rule"/>
</svg>
