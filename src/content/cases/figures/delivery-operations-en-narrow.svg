<svg viewBox="0 0 300 507" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="inherit" role="img" aria-label="Many gates reduced to one">
<style>
.fx-t1{fill:var(--text-default,#191a1b)}
.fx-t2{fill:var(--text-muted,#3a3d44)}
.fx-t3{fill:var(--text-subtle,#62666d)}
.fx-card{fill:var(--surface-sunken,#f2f3f5);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-inset{fill:var(--surface-raised,#fff);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-ghost{fill:none;stroke:var(--line-default,#ccd3dd);stroke-width:1.25;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.fx-key{fill:var(--accent-default,#08090a)}
.fx-on{fill:var(--accent-on,#fff)}
.fx-sk{fill:var(--text-subtle,#62666d);opacity:.2}
.fx-sk-on{fill:var(--accent-on,#fff);opacity:.2}
.fx-ln{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-ln-on{fill:none;stroke:var(--accent-on,#fff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-dot{stroke-dasharray:.5 5}
.fx-rule{fill:none;stroke:var(--line-strong,#dfe1e5);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-rule-on{fill:none;stroke:var(--accent-on,#fff);stroke-opacity:.16;stroke-width:1;vector-effect:non-scaling-stroke}
.fx-mk{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.25}
</style>
<circle cx="8" cy="9.3" r="8" class="fx-mk"/>
<path d="M5 6.3 L11 12.4 M11 6.3 L5 12.4" class="fx-ln" style="stroke-width:1.25"/>
<text x="24" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">WITH MANY GATES</text>
<rect x="0" y="30" width="300" height="36" rx="6" class="fx-ghost"/>
<text x="12" y="52.5" font-size="12.5" font-weight="500" class="fx-t3">01</text>
<text x="35.4" y="53" font-size="14" font-weight="500" class="fx-t3">Negotiable</text>
<rect x="0" y="74" width="300" height="36" rx="6" class="fx-ghost"/>
<text x="12" y="96.5" font-size="12.5" font-weight="500" class="fx-t3">02</text>
<text x="38.3" y="97" font-size="14" font-weight="500" class="fx-t3">Negotiable</text>
<rect x="0" y="118" width="300" height="36" rx="6" class="fx-ghost"/>
<text x="12" y="140.5" font-size="12.5" font-weight="500" class="fx-t3">03</text>
<text x="38.2" y="141" font-size="14" font-weight="500" class="fx-t3">Negotiable</text>
<rect x="0" y="162" width="300" height="36" rx="6" class="fx-ghost"/>
<text x="12" y="184.5" font-size="12.5" font-weight="500" class="fx-t3">04</text>
<text x="38.2" y="185" font-size="14" font-weight="500" class="fx-t3">Negotiable</text>
<rect x="0" y="206" width="300" height="36" rx="6" class="fx-ghost"/>
<text x="12" y="228.5" font-size="12.5" font-weight="500" class="fx-t3">05</text>
<text x="38.4" y="229" font-size="14" font-weight="500" class="fx-t3">Negotiable</text>
<text x="0" y="268" font-size="13" class="fx-t3">Each one slips, and each slip gets its own reason</text>
<path d="M150 284 L150 322" class="fx-ln"/>
<path d="M145.5 316 L150 322 L154.5 316" class="fx-ln"/>
<text x="162" y="308" font-size="12.5" font-weight="500" class="fx-t3">Reduce to one</text>
<circle cx="8" cy="353.3" r="8" class="fx-key"/>
<path d="M4.6 353.5 L7.2 356 L11.5 350.9" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="24" y="358" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">WITH ONE GATE</text>
<rect x="0" y="372" width="300" height="97" rx="8" class="fx-key"/>
<text x="12" y="406" font-size="19" font-weight="700" class="fx-on">Feature freeze</text>
<text x="12" y="432" font-size="13" opacity="0.72" class="fx-on">One date. Miss it and the work moves to the</text>
<text x="12" y="451.5" font-size="13" opacity="0.72" class="fx-on">next round</text>
<text x="0" y="499" font-size="14" font-weight="600" class="fx-t1">There is nothing left to negotiate</text>
</svg>
