<svg viewBox="0 0 300 732" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="inherit" role="img" aria-label="Fixed-format output moved out of a human queue and into a tool that knows the spec">
<style>
.fx-t1{fill:var(--text-default,#191a1b)}
.fx-t2{fill:var(--text-muted,#3a3d44)}
.fx-t3{fill:var(--text-subtle,#62666d)}
.fx-card{fill:var(--surface-sunken,#f2f3f5);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-inset{fill:var(--surface-raised,#fff);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-ghost{fill:none;stroke:var(--line-default,#ccd3dd);stroke-width:1.25;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.fx-key{fill:var(--accent-default,#08090a)}
.fx-on{fill:var(--accent-on,#fff)}
.fx-sk{fill:var(--text-subtle,#62666d);opacity:.2}
.fx-sk-on{fill:var(--accent-on,#fff);opacity:.2}
.fx-ln{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-ln-on{fill:none;stroke:var(--accent-on,#fff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-dot{stroke-dasharray:.5 5}
.fx-rule{fill:none;stroke:var(--line-strong,#dfe1e5);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-rule-on{fill:none;stroke:var(--accent-on,#fff);stroke-opacity:.16;stroke-width:1;vector-effect:non-scaling-stroke}
.fx-mk{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.25}
</style>
<circle cx="8" cy="9.3" r="8" class="fx-mk"/>
<path d="M5 6.3 L11 12.4 M11 6.3 L5 12.4" class="fx-ln" style="stroke-width:1.25"/>
<text x="24" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">A PERSON IS THE BOTTLENECK</text>
<rect x="0" y="32" width="84" height="12" rx="3" class="fx-card"/>
<path d="M90 38 C122 38 118 88 148 88" class="fx-rule"/>
<rect x="0" y="52" width="84" height="12" rx="3" class="fx-card"/>
<path d="M90 58 C122 58 118 88 148 88" class="fx-rule"/>
<rect x="0" y="72" width="84" height="12" rx="3" class="fx-card"/>
<path d="M90 78 C122 78 118 88 148 88" class="fx-rule"/>
<rect x="0" y="92" width="84" height="12" rx="3" class="fx-card"/>
<path d="M90 98 C122 98 118 88 148 88" class="fx-rule"/>
<rect x="0" y="112" width="84" height="12" rx="3" class="fx-card"/>
<path d="M90 118 C122 118 118 88 148 88" class="fx-rule"/>
<rect x="0" y="132" width="84" height="12" rx="3" class="fx-card"/>
<path d="M90 138 C122 138 118 88 148 88" class="fx-rule"/>
<rect x="152" y="68" width="148" height="40" rx="6" class="fx-card"/>
<text x="226" y="93.4" font-size="15" font-weight="600" text-anchor="middle" class="fx-t1">Queue</text>
<text x="0" y="172" font-size="13" class="fx-t3">Work needing no judgment queues up too.</text>
<path d="M150 186 L150 220" class="fx-ln"/>
<path d="M145.5 214 L150 220 L154.5 214" class="fx-ln"/>
<text x="162" y="208" font-size="12.5" font-weight="500" class="fx-t3">moved</text>
<circle cx="8" cy="245.3" r="8" class="fx-key"/>
<path d="M4.6 245.5 L7.2 248 L11.5 242.9" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="24" y="250" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">THE TOOL KNOWS THE SPEC</text>
<rect x="0" y="264" width="300" height="42" rx="8" class="fx-key"/>
<text x="12" y="290.4" font-size="15" font-weight="700" class="fx-on">Spec-aware tool</text>
<rect x="0" y="314" width="96" height="84" rx="6" class="fx-inset"/>
<text x="12" y="338" font-size="14" font-weight="600" class="fx-t1">Templates</text>
<rect x="12" y="352" width="72" height="8" rx="2" class="fx-sk"/>
<rect x="12" y="366" width="72" height="8" rx="2" class="fx-sk"/>
<rect x="12" y="380" width="43.2" height="8" rx="2" class="fx-sk"/>
<rect x="102" y="314" width="96" height="84" rx="6" class="fx-inset"/>
<text x="114" y="338" font-size="14" font-weight="600" class="fx-t1">Canvas</text>
<rect x="114" y="352" width="72" height="34" rx="3" class="fx-sk"/>
<rect x="204" y="314" width="96" height="84" rx="6" class="fx-inset"/>
<text x="216" y="338" font-size="14" font-weight="600" class="fx-t1">Export</text>
<rect x="216" y="352" width="50.4" height="8" rx="2" class="fx-sk"/>
<rect x="216" y="366" width="32.4" height="8" rx="2" class="fx-sk"/>
<path d="M286 354 L286 378" class="fx-ln" opacity="0.7"/>
<path d="M281.5 372 L286 378 L290.5 372" class="fx-ln" opacity="0.7"/>
<text x="0" y="422" font-size="13" class="fx-t3">Pick a template and the spec is already met.</text>
<path d="M0 446 H300" class="fx-rule"/>
<text x="0" y="474" font-size="12.5" font-weight="500" class="fx-t3">01</text>
<text x="26" y="474" font-size="15" font-weight="600" class="fx-t1">Ratio presets</text>
<text x="26" y="495" font-size="13" class="fx-t3">Nobody has to remember the spec.</text>
<text x="0" y="525" font-size="12.5" font-weight="500" class="fx-t3">02</text>
<text x="26" y="525" font-size="15" font-weight="600" class="fx-t1">Hidden layers</text>
<text x="26" y="546" font-size="13" class="fx-t3">Switched off means absent from the file.</text>
<text x="0" y="576" font-size="12.5" font-weight="500" class="fx-t3">03</text>
<text x="26" y="576" font-size="15" font-weight="600" class="fx-t1">On-screen capture</text>
<text x="26" y="597" font-size="13" class="fx-t3">Rendering does not happen off-screen.</text>
<rect x="0" y="615" width="300" height="63.2" rx="8" class="fx-card"/>
<circle cx="18" cy="631.8" r="8" class="fx-key"/>
<path d="M14.6 631.9 L17.2 634.5 L21.5 629.4" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="34" y="637.8" font-size="14" font-weight="600" class="fx-t1">With no server in the path, no key</text>
<text x="34" y="657.4" font-size="14" font-weight="600" class="fx-t1">leaks from the server.</text>
<text x="0" y="704.2" font-size="13" class="fx-t3">Almost nothing new was decided. The spec</text>
<text x="0" y="723.7" font-size="13" class="fx-t3">already lived in the design system.</text>
</svg>
