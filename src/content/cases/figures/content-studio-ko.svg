<svg viewBox="0 0 880 392" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="inherit" role="img" aria-label="규격이 정해진 산출물이 사람 대기열을 지나던 것을 규격을 아는 도구로 옮긴 구조">
<style>
.fx-t1{fill:var(--text-default,#191a1b)}
.fx-t2{fill:var(--text-muted,#3a3d44)}
.fx-t3{fill:var(--text-subtle,#62666d)}
.fx-card{fill:var(--surface-sunken,#f2f3f5);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-inset{fill:var(--surface-raised,#fff);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-ghost{fill:none;stroke:var(--line-default,#ccd3dd);stroke-width:1.25;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.fx-key{fill:var(--accent-default,#08090a)}
.fx-on{fill:var(--accent-on,#fff)}
.fx-sk{fill:var(--text-subtle,#62666d);opacity:.2}
.fx-sk-on{fill:var(--accent-on,#fff);opacity:.2}
.fx-ln{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-ln-on{fill:none;stroke:var(--accent-on,#fff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-dot{stroke-dasharray:.5 5}
.fx-rule{fill:none;stroke:var(--line-strong,#dfe1e5);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-rule-on{fill:none;stroke:var(--accent-on,#fff);stroke-opacity:.16;stroke-width:1;vector-effect:non-scaling-stroke}
.fx-mk{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.25}
</style>
<circle cx="8" cy="9.3" r="8" class="fx-mk"/>
<path d="M5 6.3 L11 12.4 M11 6.3 L5 12.4" class="fx-ln" style="stroke-width:1.25"/>
<text x="24" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">사람이 병목이다</text>
<rect x="0" y="36" width="104" height="12" rx="3" class="fx-card"/>
<path d="M110 42 C138 42 134 92 164 92" class="fx-rule"/>
<rect x="0" y="56" width="104" height="12" rx="3" class="fx-card"/>
<path d="M110 62 C138 62 134 92 164 92" class="fx-rule"/>
<rect x="0" y="76" width="104" height="12" rx="3" class="fx-card"/>
<path d="M110 82 C138 82 134 92 164 92" class="fx-rule"/>
<rect x="0" y="96" width="104" height="12" rx="3" class="fx-card"/>
<path d="M110 102 C138 102 134 92 164 92" class="fx-rule"/>
<rect x="0" y="116" width="104" height="12" rx="3" class="fx-card"/>
<path d="M110 122 C138 122 134 92 164 92" class="fx-rule"/>
<rect x="0" y="136" width="104" height="12" rx="3" class="fx-card"/>
<path d="M110 142 C138 142 134 92 164 92" class="fx-rule"/>
<rect x="168" y="72" width="150" height="40" rx="6" class="fx-card"/>
<text x="243" y="97.4" font-size="15" font-weight="600" text-anchor="middle" class="fx-t1">대기열</text>
<text x="0" y="190" font-size="13.5" class="fx-t3">판단이 필요 없는 일까지 줄을 선다</text>
<path d="M340 92 L394 92" class="fx-ln"/>
<path d="M388 96.5 L394 92 L388 87.5" class="fx-ln"/>
<text x="367" y="80" font-size="12" font-weight="500" text-anchor="middle" class="fx-t3">옮김</text>
<circle cx="418" cy="9.3" r="8" class="fx-key"/>
<path d="M414.6 9.5 L417.2 12 L421.5 6.9" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="434" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">도구가 규격을 안다</text>
<rect x="410" y="30" width="470" height="46" rx="8" class="fx-key"/>
<text x="426" y="58.8" font-size="16" font-weight="700" class="fx-on">규격을 아는 도구</text>
<rect x="410" y="84" width="150" height="86" rx="6" class="fx-inset"/>
<text x="422" y="108" font-size="14" font-weight="600" class="fx-t1">템플릿</text>
<rect x="422" y="122" width="126" height="8" rx="2" class="fx-sk"/>
<rect x="422" y="136" width="126" height="8" rx="2" class="fx-sk"/>
<rect x="422" y="150" width="75.6" height="8" rx="2" class="fx-sk"/>
<rect x="570" y="84" width="150" height="86" rx="6" class="fx-inset"/>
<text x="582" y="108" font-size="14" font-weight="600" class="fx-t1">화면</text>
<rect x="582" y="122" width="126" height="36" rx="3" class="fx-sk"/>
<rect x="730" y="84" width="150" height="86" rx="6" class="fx-inset"/>
<text x="742" y="108" font-size="14" font-weight="600" class="fx-t1">내보내기</text>
<rect x="742" y="122" width="88.2" height="8" rx="2" class="fx-sk"/>
<rect x="742" y="136" width="56.7" height="8" rx="2" class="fx-sk"/>
<path d="M866 124 L866 148" class="fx-ln" opacity="0.7"/>
<path d="M861.5 142 L866 148 L870.5 142" class="fx-ln" opacity="0.7"/>
<text x="410" y="190" font-size="13.5" class="fx-t3">템플릿을 고르면 규격은 이미 지켜져 있다</text>
<path d="M0 222 H880" class="fx-rule"/>
<text x="0" y="252" font-size="12" font-weight="500" class="fx-t3">01</text>
<text x="26" y="252" font-size="16" font-weight="600" class="fx-t1">비율 프리셋</text>
<text x="26" y="276" font-size="13.5" class="fx-t3">사람이 규격을 기억하지 않는다</text>
<text x="302.7" y="252" font-size="12" font-weight="500" class="fx-t3">02</text>
<text x="328.7" y="252" font-size="16" font-weight="600" class="fx-t1">숨긴 레이어</text>
<text x="328.7" y="276" font-size="13.5" class="fx-t3">끈 것은 파일에도 없다</text>
<text x="605.3" y="252" font-size="12" font-weight="500" class="fx-t3">03</text>
<text x="631.3" y="252" font-size="16" font-weight="600" class="fx-t1">화면 안 캡처</text>
<text x="631.3" y="276" font-size="13.5" class="fx-t3">화면 밖에서는 렌더가 일어나지 않는다</text>
<rect x="0" y="304" width="880" height="50" rx="8" class="fx-card"/>
<circle cx="24" cy="329" r="8" class="fx-key"/>
<path d="M20.6 329.2 L23.2 331.7 L27.5 326.6" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="42" y="334.4" font-size="15" font-weight="600" class="fx-t1">서버를 거치지 않으면 서버에서 키가 새지 않는다</text>
<text x="0" y="384" font-size="13.5" class="fx-t3">새로 정한 것이 거의 없다. 규격은 이미 디자인 시스템에 있었다</text>
</svg>
