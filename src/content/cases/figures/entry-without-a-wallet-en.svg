<svg viewBox="0 0 880 432" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="inherit" role="img" aria-label="The difference between leading with the wallet and splitting browsing from buying">
<style>
.fx-t1{fill:var(--text-default,#191a1b)}
.fx-t2{fill:var(--text-muted,#3a3d44)}
.fx-t3{fill:var(--text-subtle,#62666d)}
.fx-card{fill:var(--surface-sunken,#f2f3f5);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-inset{fill:var(--surface-raised,#fff);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-ghost{fill:none;stroke:var(--line-default,#ccd3dd);stroke-width:1.25;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.fx-key{fill:var(--accent-default,#08090a)}
.fx-on{fill:var(--accent-on,#fff)}
.fx-sk{fill:var(--text-subtle,#62666d);opacity:.2}
.fx-sk-on{fill:var(--accent-on,#fff);opacity:.2}
.fx-ln{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-ln-on{fill:none;stroke:var(--accent-on,#fff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-dot{stroke-dasharray:.5 5}
.fx-rule{fill:none;stroke:var(--line-strong,#dfe1e5);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-rule-on{fill:none;stroke:var(--accent-on,#fff);stroke-opacity:.16;stroke-width:1;vector-effect:non-scaling-stroke}
.fx-mk{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.25}
</style>
<circle cx="8" cy="9.3" r="8" class="fx-mk"/>
<path d="M5 6.3 L11 12.4 M11 6.3 L5 12.4" class="fx-ln" style="stroke-width:1.25"/>
<text x="24" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">Leading with the wallet</text>
<rect x="0" y="34" width="190" height="72" rx="6" class="fx-key"/>
<text x="16" y="58.6" font-size="12" font-weight="500" opacity="0.6" class="fx-on">01</text>
<text x="16" y="90" font-size="16" font-weight="600" class="fx-on">Connect wallet</text>
<rect x="230" y="34" width="190" height="72" rx="6" class="fx-ghost"/>
<text x="246" y="58.6" font-size="12" font-weight="500" class="fx-t3">02</text>
<text x="246" y="90" font-size="16" font-weight="500" class="fx-t3">See the product</text>
<rect x="460" y="34" width="190" height="72" rx="6" class="fx-ghost"/>
<text x="476" y="58.6" font-size="12" font-weight="500" class="fx-t3">03</text>
<text x="476" y="90" font-size="16" font-weight="500" class="fx-t3">Buy</text>
<path d="M198 70 L222 70" class="fx-ln fx-dot"/>
<path d="M216 74.5 L222 70 L216 65.5" class="fx-ln"/>
<path d="M428 70 L452 70" class="fx-ln fx-dot"/>
<path d="M446 74.5 L452 70 L446 65.5" class="fx-ln"/>
<path d="M95 114 L95 151 L121 151" class="fx-ln fx-dot"/>
<path d="M115 155.5 L121 151 L115 146.5" class="fx-ln"/>
<text x="133" y="156" font-size="15" font-weight="600" class="fx-t1">They leave having seen nothing</text>
<text x="133" y="180" font-size="13.5" class="fx-t3">Uninterested or unequipped, the two look identical</text>
<path d="M0 214 H880" class="fx-rule"/>
<circle cx="8" cy="249.3" r="8" class="fx-key"/>
<path d="M4.6 249.5 L7.2 252 L11.5 246.9" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="24" y="254" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">Splitting browsing from buying</text>
<rect x="0" y="274" width="190" height="72" rx="6" class="fx-card"/>
<text x="16" y="298.6" font-size="12" font-weight="500" class="fx-t3">01</text>
<text x="16" y="330" font-size="16" font-weight="600" class="fx-t1">Log in</text>
<rect x="230" y="274" width="190" height="72" rx="6" class="fx-card"/>
<text x="246" y="298.6" font-size="12" font-weight="500" class="fx-t3">02</text>
<text x="246" y="330" font-size="16" font-weight="600" class="fx-t1">Whole product</text>
<rect x="460" y="274" width="190" height="72" rx="6" class="fx-key"/>
<text x="476" y="298.6" font-size="12" font-weight="500" opacity="0.6" class="fx-on">03</text>
<text x="476" y="330" font-size="16" font-weight="600" class="fx-on">Connect wallet</text>
<rect x="690" y="274" width="190" height="72" rx="6" class="fx-card"/>
<text x="706" y="298.6" font-size="12" font-weight="500" class="fx-t3">04</text>
<text x="706" y="330" font-size="16" font-weight="600" class="fx-t1">Buy</text>
<path d="M198 310 L222 310" class="fx-ln"/>
<path d="M216 314.5 L222 310 L216 305.5" class="fx-ln"/>
<path d="M428 310 L452 310" class="fx-ln"/>
<path d="M446 314.5 L452 310 L446 305.5" class="fx-ln"/>
<path d="M658 310 L682 310" class="fx-ln"/>
<path d="M676 314.5 L682 310 L676 305.5" class="fx-ln"/>
<path d="M1 354 V360 H649 V354" class="fx-ln" style="stroke-width:1.25"/>
<path d="M24 360 V374" class="fx-ln" style="stroke-width:1.25"/>
<text x="0" y="400" font-size="15" font-weight="600" class="fx-t1">By here the reason to go get the prerequisite already exists</text>
<text x="0" y="424" font-size="13.5" class="fx-t3">The wallet is not issued for them, so no place is created for a key to pass through</text>
</svg>
