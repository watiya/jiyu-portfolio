<svg viewBox="0 0 880 392" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="inherit" role="img" aria-label="Many gates reduced to one">
<style>
.fx-t1{fill:var(--text-default,#191a1b)}
.fx-t2{fill:var(--text-muted,#3a3d44)}
.fx-t3{fill:var(--text-subtle,#62666d)}
.fx-card{fill:var(--surface-sunken,#f2f3f5);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-inset{fill:var(--surface-raised,#fff);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-ghost{fill:none;stroke:var(--line-default,#ccd3dd);stroke-width:1.25;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.fx-key{fill:var(--accent-default,#08090a)}
.fx-on{fill:var(--accent-on,#fff)}
.fx-sk{fill:var(--text-subtle,#62666d);opacity:.2}
.fx-sk-on{fill:var(--accent-on,#fff);opacity:.2}
.fx-ln{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-ln-on{fill:none;stroke:var(--accent-on,#fff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-dot{stroke-dasharray:.5 5}
.fx-rule{fill:none;stroke:var(--line-strong,#dfe1e5);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-rule-on{fill:none;stroke:var(--accent-on,#fff);stroke-opacity:.16;stroke-width:1;vector-effect:non-scaling-stroke}
.fx-mk{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.25}
</style>
<circle cx="8" cy="9.3" r="8" class="fx-mk"/>
<path d="M5 6.3 L11 12.4 M11 6.3 L5 12.4" class="fx-ln" style="stroke-width:1.25"/>
<text x="24" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">WITH MANY GATES</text>
<rect x="0" y="32" width="156.8" height="72" rx="6" class="fx-ghost"/>
<text x="16" y="56.6" font-size="12" font-weight="500" class="fx-t3">01</text>
<text x="16" y="88" font-size="15" font-weight="500" class="fx-t3">Negotiable</text>
<path d="M162.8 68 L174.8 68" class="fx-ln" opacity="0.8"/>
<path d="M168.8 72.5 L174.8 68 L168.8 63.5" class="fx-ln" opacity="0.8"/>
<rect x="180.8" y="32" width="156.8" height="72" rx="6" class="fx-ghost"/>
<text x="196.8" y="56.6" font-size="12" font-weight="500" class="fx-t3">02</text>
<text x="196.8" y="88" font-size="15" font-weight="500" class="fx-t3">Negotiable</text>
<path d="M343.6 68 L355.6 68" class="fx-ln" opacity="0.8"/>
<path d="M349.6 72.5 L355.6 68 L349.6 63.5" class="fx-ln" opacity="0.8"/>
<rect x="361.6" y="32" width="156.8" height="72" rx="6" class="fx-ghost"/>
<text x="377.6" y="56.6" font-size="12" font-weight="500" class="fx-t3">03</text>
<text x="377.6" y="88" font-size="15" font-weight="500" class="fx-t3">Negotiable</text>
<path d="M524.4 68 L536.4 68" class="fx-ln" opacity="0.8"/>
<path d="M530.4 72.5 L536.4 68 L530.4 63.5" class="fx-ln" opacity="0.8"/>
<rect x="542.4" y="32" width="156.8" height="72" rx="6" class="fx-ghost"/>
<text x="558.4" y="56.6" font-size="12" font-weight="500" class="fx-t3">04</text>
<text x="558.4" y="88" font-size="15" font-weight="500" class="fx-t3">Negotiable</text>
<path d="M705.2 68 L717.2 68" class="fx-ln" opacity="0.8"/>
<path d="M711.2 72.5 L717.2 68 L711.2 63.5" class="fx-ln" opacity="0.8"/>
<rect x="723.2" y="32" width="156.8" height="72" rx="6" class="fx-ghost"/>
<text x="739.2" y="56.6" font-size="12" font-weight="500" class="fx-t3">05</text>
<text x="739.2" y="88" font-size="15" font-weight="500" class="fx-t3">Negotiable</text>
<text x="0" y="134" font-size="13.5" class="fx-t3">Each one slips, and each slip gets its own reason</text>
<path d="M440 156 L440 204" class="fx-ln"/>
<path d="M435.5 198 L440 204 L444.5 198" class="fx-ln"/>
<text x="456" y="186" font-size="12" font-weight="500" class="fx-t3">Reduce to one</text>
<circle cx="8" cy="239.3" r="8" class="fx-key"/>
<path d="M4.6 239.5 L7.2 242 L11.5 236.9" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="24" y="244" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">WITH ONE GATE</text>
<rect x="0" y="262" width="880" height="88" rx="8" class="fx-key"/>
<text x="24" y="302" font-size="22" font-weight="700" class="fx-on">Feature freeze</text>
<text x="24" y="328" font-size="13.5" opacity="0.72" class="fx-on">One date. Miss it and the work moves to the next round</text>
<text x="0" y="384" font-size="15" font-weight="600" class="fx-t1">There is nothing left to negotiate</text>
</svg>
