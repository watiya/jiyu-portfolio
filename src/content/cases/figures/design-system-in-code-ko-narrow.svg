<svg viewBox="0 0 300 425" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="inherit" role="img" aria-label="원시 토큰과 시맨틱 토큰의 2계층 구조">
<style>
.fx-t1{fill:var(--text-default,#191a1b)}
.fx-t2{fill:var(--text-muted,#3a3d44)}
.fx-t3{fill:var(--text-subtle,#62666d)}
.fx-card{fill:var(--surface-sunken,#f2f3f5);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-inset{fill:var(--surface-raised,#fff);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-ghost{fill:none;stroke:var(--line-default,#ccd3dd);stroke-width:1.25;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.fx-key{fill:var(--accent-default,#08090a)}
.fx-on{fill:var(--accent-on,#fff)}
.fx-sk{fill:var(--text-subtle,#62666d);opacity:.2}
.fx-sk-on{fill:var(--accent-on,#fff);opacity:.2}
.fx-ln{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-ln-on{fill:none;stroke:var(--accent-on,#fff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-dot{stroke-dasharray:.5 5}
.fx-rule{fill:none;stroke:var(--line-strong,#dfe1e5);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-rule-on{fill:none;stroke:var(--accent-on,#fff);stroke-opacity:.16;stroke-width:1;vector-effect:non-scaling-stroke}
.fx-mk{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.25}
</style>
<text x="0" y="14" font-size="12.5" font-weight="500" class="fx-t3">01</text>
<text x="24" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">1계층 원시</text>
<rect x="0" y="26" width="300" height="76" rx="8" class="fx-card"/>
<rect x="12" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.92"/>
<rect x="59" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.72"/>
<rect x="106" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.54"/>
<rect x="153" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.38"/>
<rect x="200" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.24"/>
<rect x="247" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.12"/>
<text x="12" y="88" font-size="13" class="fx-t3">값만 갖는다. 화면이 직접 쓰지 않는다</text>
<path d="M50 108 L50 130" class="fx-ln"/>
<path d="M45.5 124 L50 130 L54.5 124" class="fx-ln"/>
<path d="M150 108 L150 130" class="fx-ln"/>
<path d="M145.5 124 L150 130 L154.5 124" class="fx-ln"/>
<path d="M250 108 L250 130" class="fx-ln"/>
<path d="M245.5 124 L250 130 L254.5 124" class="fx-ln"/>
<text x="0" y="152" font-size="12.5" font-weight="500" class="fx-t3">02</text>
<text x="24" y="152" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">2계층 시맨틱</text>
<rect x="0" y="164" width="300" height="72.3" rx="8" class="fx-key"/>
<text x="12" y="194.8" font-size="16" font-weight="700" class="fx-on">배경 · 글자 · 선 · 강조</text>
<text x="12" y="219.7" font-size="13" opacity="0.72" class="fx-on">의미를 갖고 원시를 가리킨다. 테마는 여기서만 바뀐다</text>
<path d="M50 242.3 L50 264.3" class="fx-ln"/>
<path d="M45.5 258.3 L50 264.3 L54.5 258.3" class="fx-ln"/>
<path d="M150 242.3 L150 264.3" class="fx-ln"/>
<path d="M145.5 258.3 L150 264.3 L154.5 258.3" class="fx-ln"/>
<path d="M250 242.3 L250 264.3" class="fx-ln"/>
<path d="M245.5 258.3 L250 264.3 L254.5 258.3" class="fx-ln"/>
<text x="0" y="286.3" font-size="12.5" font-weight="500" class="fx-t3">03</text>
<text x="24" y="286.3" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">화면</text>
<rect x="0" y="298.3" width="94.7" height="70" rx="8" class="fx-card"/>
<rect x="39.3" y="312.3" width="16" height="16" rx="3" class="fx-inset" style="fill:#ffffff"/>
<text x="47.3" y="352.3" font-size="13.5" font-weight="600" text-anchor="middle" class="fx-t1">밝은 화면</text>
<rect x="102.7" y="298.3" width="94.7" height="70" rx="8" class="fx-card"/>
<rect x="142" y="312.3" width="16" height="16" rx="3" class="fx-inset" style="fill:#191a1b"/>
<text x="150" y="352.3" font-size="13.5" font-weight="600" text-anchor="middle" class="fx-t1">어두운 화면</text>
<rect x="205.3" y="298.3" width="94.7" height="70" rx="8" class="fx-card"/>
<rect x="244.7" y="312.3" width="16" height="16" rx="2" class="fx-inset"/>
<path d="M248.7 318.4 H256.7 M248.7 322.5 H253.7" class="fx-ln" style="stroke-width:1.25"/>
<text x="252.7" y="352.3" font-size="13.5" font-weight="600" text-anchor="middle" class="fx-t1">인쇄</text>
<path d="M1 376.3 V382.3 H299 V376.3" class="fx-ln" style="stroke-width:1.25"/>
<path d="M20 382.3 V394.3" class="fx-ln" style="stroke-width:1.25"/>
<circle cx="20" cy="412.3" r="8" class="fx-key"/>
<path d="M16.6 412.5 L19.2 415 L23.5 409.9" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="36" y="417" font-size="13" font-weight="500" class="fx-t2">세 테마의 키 목록이 같은지는 기계가 대조한다</text>
</svg>
