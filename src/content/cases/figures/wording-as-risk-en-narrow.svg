<svg viewBox="0 0 300 384" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="inherit" role="img" aria-label="Changing the verb versus moving the subject">
<style>
.fx-t1{fill:var(--text-default,#191a1b)}
.fx-t2{fill:var(--text-muted,#3a3d44)}
.fx-t3{fill:var(--text-subtle,#62666d)}
.fx-card{fill:var(--surface-sunken,#f2f3f5);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-inset{fill:var(--surface-raised,#fff);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-ghost{fill:none;stroke:var(--line-default,#ccd3dd);stroke-width:1.25;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.fx-key{fill:var(--accent-default,#08090a)}
.fx-on{fill:var(--accent-on,#fff)}
.fx-sk{fill:var(--text-subtle,#62666d);opacity:.2}
.fx-sk-on{fill:var(--accent-on,#fff);opacity:.2}
.fx-ln{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-ln-on{fill:none;stroke:var(--accent-on,#fff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-dot{stroke-dasharray:.5 5}
.fx-rule{fill:none;stroke:var(--line-strong,#dfe1e5);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-rule-on{fill:none;stroke:var(--accent-on,#fff);stroke-opacity:.16;stroke-width:1;vector-effect:non-scaling-stroke}
.fx-mk{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.25}
</style>
<text x="26" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">SUBJECT</text>
<text x="136" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">VERB</text>
<path d="M26 26 H300" class="fx-rule"/>
<circle cx="8" cy="47" r="3.5" class="fx-t3"/>
<text x="26" y="52" font-size="14" font-weight="600" class="fx-t2">Before</text>
<rect x="26" y="64" width="100" height="46" rx="6" class="fx-card"/>
<text x="36" y="83.3" font-size="14" font-weight="600" class="fx-t1">The</text>
<text x="36" y="100.8" font-size="14" font-weight="600" class="fx-t1">company</text>
<rect x="136" y="64" width="164" height="46" rx="6" class="fx-card"/>
<text x="146" y="92" font-size="14" font-weight="600" class="fx-t1">approves</text>
<text x="26" y="132" font-size="13" class="fx-t3">Grants authority</text>
<circle cx="8" cy="169" r="8" class="fx-mk"/>
<path d="M5 165.9 L11 172 M11 165.9 L5 172" class="fx-ln" style="stroke-width:1.25"/>
<text x="26" y="174" font-size="14" font-weight="600" class="fx-t1">Softening only the verb</text>
<rect x="26" y="186" width="100" height="46" rx="6" class="fx-card"/>
<text x="36" y="205.3" font-size="14" font-weight="600" class="fx-t1">The</text>
<text x="36" y="222.8" font-size="14" font-weight="600" class="fx-t1">company</text>
<rect x="136" y="186" width="164" height="46" rx="6" class="fx-card"/>
<text x="146" y="214" font-size="14" font-weight="600" class="fx-t1">checks requirements</text>
<text x="26" y="254" font-size="13" class="fx-t3">Still there</text>
<circle cx="8" cy="291" r="8" class="fx-key"/>
<path d="M4.6 291.1 L7.2 293.7 L11.5 288.6" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="26" y="296" font-size="14" font-weight="600" class="fx-t1">Removing the subject</text>
<rect x="26" y="308" width="100" height="46" rx="6" class="fx-ghost"/>
<rect x="136" y="308" width="164" height="46" rx="6" class="fx-key"/>
<text x="146" y="336" font-size="14" font-weight="600" class="fx-on">Submitted</text>
<text x="26" y="376" font-size="13" class="fx-t3">A state, not an act</text>
<path d="M8 59 V157" class="fx-rule"/>
<path d="M8 181 V279" class="fx-rule"/>
</svg>
