<svg viewBox="0 0 300 484" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="inherit" role="img" aria-label="Two layers of primitive and semantic tokens">
<style>
.fx-t1{fill:var(--text-default,#191a1b)}
.fx-t2{fill:var(--text-muted,#3a3d44)}
.fx-t3{fill:var(--text-subtle,#62666d)}
.fx-card{fill:var(--surface-sunken,#f2f3f5);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-inset{fill:var(--surface-raised,#fff);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-ghost{fill:none;stroke:var(--line-default,#ccd3dd);stroke-width:1.25;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.fx-key{fill:var(--accent-default,#08090a)}
.fx-on{fill:var(--accent-on,#fff)}
.fx-sk{fill:var(--text-subtle,#62666d);opacity:.2}
.fx-sk-on{fill:var(--accent-on,#fff);opacity:.2}
.fx-ln{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-ln-on{fill:none;stroke:var(--accent-on,#fff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-dot{stroke-dasharray:.5 5}
.fx-rule{fill:none;stroke:var(--line-strong,#dfe1e5);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-rule-on{fill:none;stroke:var(--accent-on,#fff);stroke-opacity:.16;stroke-width:1;vector-effect:non-scaling-stroke}
.fx-mk{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.25}
</style>
<text x="0" y="14" font-size="12.5" font-weight="500" class="fx-t3">01</text>
<text x="24" y="14" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">LAYER 1 PRIMITIVE</text>
<rect x="0" y="26" width="300" height="95.5" rx="8" class="fx-card"/>
<rect x="12" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.92"/>
<rect x="59" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.72"/>
<rect x="106" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.54"/>
<rect x="153" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.38"/>
<rect x="200" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.24"/>
<rect x="247" y="38" width="41" height="28" rx="3" class="fx-key" opacity="0.12"/>
<text x="12" y="88" font-size="13" class="fx-t3">Values only. Screens never reference these</text>
<text x="12" y="107.5" font-size="13" class="fx-t3">directly</text>
<path d="M50 127.5 L50 149.5" class="fx-ln"/>
<path d="M45.5 143.5 L50 149.5 L54.5 143.5" class="fx-ln"/>
<path d="M150 127.5 L150 149.5" class="fx-ln"/>
<path d="M145.5 143.5 L150 149.5 L154.5 143.5" class="fx-ln"/>
<path d="M250 127.5 L250 149.5" class="fx-ln"/>
<path d="M245.5 143.5 L250 149.5 L254.5 143.5" class="fx-ln"/>
<text x="0" y="171.5" font-size="12.5" font-weight="500" class="fx-t3">02</text>
<text x="24" y="171.5" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">LAYER 2 SEMANTIC</text>
<rect x="0" y="183.5" width="300" height="91.8" rx="8" class="fx-key"/>
<text x="12" y="214.3" font-size="16" font-weight="700" class="fx-on">Background · Text · Border · Accent</text>
<text x="12" y="239.2" font-size="13" opacity="0.72" class="fx-on">Meaning, pointing at primitives. Themes</text>
<text x="12" y="258.7" font-size="13" opacity="0.72" class="fx-on">change only here</text>
<path d="M50 281.3 L50 303.3" class="fx-ln"/>
<path d="M45.5 297.3 L50 303.3 L54.5 297.3" class="fx-ln"/>
<path d="M150 281.3 L150 303.3" class="fx-ln"/>
<path d="M145.5 297.3 L150 303.3 L154.5 297.3" class="fx-ln"/>
<path d="M250 281.3 L250 303.3" class="fx-ln"/>
<path d="M245.5 297.3 L250 303.3 L254.5 297.3" class="fx-ln"/>
<text x="0" y="325.3" font-size="12.5" font-weight="500" class="fx-t3">03</text>
<text x="24" y="325.3" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">SCREENS</text>
<rect x="0" y="337.3" width="94.7" height="70" rx="8" class="fx-card"/>
<rect x="39.3" y="351.3" width="16" height="16" rx="3" class="fx-inset" style="fill:#ffffff"/>
<text x="47.3" y="391.3" font-size="13.5" font-weight="600" text-anchor="middle" class="fx-t1">Light</text>
<rect x="102.7" y="337.3" width="94.7" height="70" rx="8" class="fx-card"/>
<rect x="142" y="351.3" width="16" height="16" rx="3" class="fx-inset" style="fill:#191a1b"/>
<text x="150" y="391.3" font-size="13.5" font-weight="600" text-anchor="middle" class="fx-t1">Dark</text>
<rect x="205.3" y="337.3" width="94.7" height="70" rx="8" class="fx-card"/>
<rect x="244.7" y="351.3" width="16" height="16" rx="2" class="fx-inset"/>
<path d="M248.7 357.4 H256.7 M248.7 361.5 H253.7" class="fx-ln" style="stroke-width:1.25"/>
<text x="252.7" y="391.3" font-size="13.5" font-weight="600" text-anchor="middle" class="fx-t1">Print</text>
<path d="M1 415.3 V421.3 H299 V415.3" class="fx-ln" style="stroke-width:1.25"/>
<path d="M20 421.3 V433.3" class="fx-ln" style="stroke-width:1.25"/>
<circle cx="20" cy="451.3" r="8" class="fx-key"/>
<path d="M16.6 451.5 L19.2 454 L23.5 448.9" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="36" y="456" font-size="13" font-weight="500" class="fx-t2">A check compares the key lists of all three</text>
<text x="36" y="475.5" font-size="13" font-weight="500" class="fx-t2">themes</text>
</svg>
