<svg viewBox="0 0 880 386" xmlns="http://www.w3.org/2000/svg" fill="none" font-family="inherit" role="img" aria-label="원시 토큰과 시맨틱 토큰의 2계층 구조">
<style>
.fx-t1{fill:var(--text-default,#191a1b)}
.fx-t2{fill:var(--text-muted,#3a3d44)}
.fx-t3{fill:var(--text-subtle,#62666d)}
.fx-card{fill:var(--surface-sunken,#f2f3f5);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-inset{fill:var(--surface-raised,#fff);stroke:var(--line-default,#ccd3dd);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-ghost{fill:none;stroke:var(--line-default,#ccd3dd);stroke-width:1.25;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.fx-key{fill:var(--accent-default,#08090a)}
.fx-on{fill:var(--accent-on,#fff)}
.fx-sk{fill:var(--text-subtle,#62666d);opacity:.2}
.fx-sk-on{fill:var(--accent-on,#fff);opacity:.2}
.fx-ln{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-ln-on{fill:none;stroke:var(--accent-on,#fff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fx-dot{stroke-dasharray:.5 5}
.fx-rule{fill:none;stroke:var(--line-strong,#dfe1e5);stroke-width:1;vector-effect:non-scaling-stroke}
.fx-rule-on{fill:none;stroke:var(--accent-on,#fff);stroke-opacity:.16;stroke-width:1;vector-effect:non-scaling-stroke}
.fx-mk{fill:none;stroke:var(--text-subtle,#62666d);stroke-width:1.25}
</style>
<text x="0" y="20" font-size="12" font-weight="500" class="fx-t3">01</text>
<text x="0" y="42" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">1계층 원시</text>
<rect x="190" y="0" width="690" height="96" rx="8" class="fx-card"/>
<rect x="206" y="16" width="101.3" height="34" rx="4" class="fx-key" opacity="0.92"/>
<rect x="317.3" y="16" width="101.3" height="34" rx="4" class="fx-key" opacity="0.72"/>
<rect x="428.7" y="16" width="101.3" height="34" rx="4" class="fx-key" opacity="0.54"/>
<rect x="540" y="16" width="101.3" height="34" rx="4" class="fx-key" opacity="0.38"/>
<rect x="651.3" y="16" width="101.3" height="34" rx="4" class="fx-key" opacity="0.24"/>
<rect x="762.7" y="16" width="101.3" height="34" rx="4" class="fx-key" opacity="0.12"/>
<text x="206" y="78" font-size="13.5" class="fx-t3">값만 갖는다. 화면이 직접 쓰지 않는다</text>
<path d="M305 104 L305 132" class="fx-ln"/>
<path d="M300.5 126 L305 132 L309.5 126" class="fx-ln"/>
<path d="M535 104 L535 132" class="fx-ln"/>
<path d="M530.5 126 L535 132 L539.5 126" class="fx-ln"/>
<path d="M765 104 L765 132" class="fx-ln"/>
<path d="M760.5 126 L765 132 L769.5 126" class="fx-ln"/>
<text x="0" y="160" font-size="12" font-weight="500" class="fx-t3">02</text>
<text x="0" y="182" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">2계층 시맨틱</text>
<rect x="190" y="140" width="690" height="84" rx="8" class="fx-key"/>
<text x="210" y="176" font-size="18" font-weight="700" class="fx-on">배경 · 글자 · 선 · 강조</text>
<text x="210" y="202" font-size="13.5" opacity="0.72" class="fx-on">의미를 갖고 원시를 가리킨다. 테마는 여기서만 바뀐다</text>
<path d="M305 232 L305 260" class="fx-ln"/>
<path d="M300.5 254 L305 260 L309.5 254" class="fx-ln"/>
<path d="M535 232 L535 260" class="fx-ln"/>
<path d="M530.5 254 L535 260 L539.5 254" class="fx-ln"/>
<path d="M765 232 L765 260" class="fx-ln"/>
<path d="M760.5 254 L765 260 L769.5 254" class="fx-ln"/>
<text x="0" y="288" font-size="12" font-weight="500" class="fx-t3">03</text>
<text x="0" y="310" font-size="13" font-weight="600" letter-spacing="0.2" class="fx-t2">화면</text>
<rect x="190" y="268" width="219.3" height="60" rx="8" class="fx-card"/>
<rect x="208" y="289" width="18" height="18" rx="3" class="fx-inset" style="fill:#ffffff"/>
<text x="238" y="303.8" font-size="16" font-weight="600" class="fx-t1">밝은 화면</text>
<rect x="425.3" y="268" width="219.3" height="60" rx="8" class="fx-card"/>
<rect x="443.3" y="289" width="18" height="18" rx="3" class="fx-inset" style="fill:#191a1b"/>
<text x="473.3" y="303.8" font-size="16" font-weight="600" class="fx-t1">어두운 화면</text>
<rect x="660.7" y="268" width="219.3" height="60" rx="8" class="fx-card"/>
<rect x="678.7" y="289" width="18" height="18" rx="2" class="fx-inset"/>
<path d="M682.7 295.8 H692.7 M682.7 300.5 H689.7" class="fx-ln" style="stroke-width:1.25"/>
<text x="708.7" y="303.8" font-size="16" font-weight="600" class="fx-t1">인쇄</text>
<path d="M191 336 V342 H879 V336" class="fx-ln" style="stroke-width:1.25"/>
<path d="M214 342 V354" class="fx-ln" style="stroke-width:1.25"/>
<circle cx="214" cy="374" r="8" class="fx-key"/>
<path d="M210.6 374.2 L213.2 376.7 L217.5 371.6" class="fx-ln-on" style="stroke-width:1.5"/>
<text x="230" y="378.9" font-size="13.5" font-weight="500" class="fx-t2">세 테마의 키 목록이 같은지는 기계가 대조한다</text>
</svg>
